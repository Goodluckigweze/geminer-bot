openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GemMiner Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Bot control and status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get bot status
      description: Returns the current state of the bot
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/start:
    post:
      operationId: launchBot
      tags: [bot]
      summary: Start the bot
      description: Launches the Playwright browser and starts the automation loop
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"
        "409":
          description: Bot is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/stop:
    post:
      operationId: stopBot
      tags: [bot]
      summary: Stop the bot
      description: Stops the automation loop and closes the browser
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/logs:
    get:
      operationId: getBotLogs
      tags: [bot]
      summary: Get activity logs
      description: Returns recent bot activity log entries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"

  /bot/stats:
    get:
      operationId: getBotStats
      tags: [bot]
      summary: Get bot statistics
      description: Returns gem counts, actions taken, and session data
      responses:
        "200":
          description: Bot statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BotStatus:
      type: object
      properties:
        state:
          type: string
          enum: [idle, starting, waiting_for_wallet, running, stopping, stopped, error]
        message:
          type: string
        startedAt:
          type: ["string", "null"]
        stoppedAt:
          type: ["string", "null"]
        currentAction:
          type: ["string", "null"]
      required:
        - state
        - message

    BotStats:
      type: object
      properties:
        missionsCompleted:
          type: integer
        wheelSpins:
          type: integer
        coinFlips:
          type: integer
        actionsTotal:
          type: integer
        sessionStartedAt:
          type: ["string", "null"]
        uptime:
          type: ["integer", "null"]
      required:
        - missionsCompleted
        - wheelSpins
        - coinFlips
        - actionsTotal

    LogEntry:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
        level:
          type: string
          enum: [info, success, warning, error]
        message:
          type: string
      required:
        - id
        - timestamp
        - level
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
